  <script>
    (function() {
      // Kiểm tra trình duyệt có tương thích không
      function isSupportedBrowser() {
        const ua = navigator.userAgent.toLowerCase();
        // Kiểm tra Chrome (loại trừ Edge, Opera, Samsung Browser, Zalo)
        const isChrome = ua.includes('chrome') && !ua.includes('edg') && !ua.includes('opr') && !ua.includes('samsung') && !ua.includes('zalo');
        // Kiểm tra Safari thực (không phải Chrome trên iOS, loại trừ Zalo)
        const isSafari = ua.includes('safari') && !ua.includes('chrome') && !ua.includes('android') && !ua.includes('zalo');
        return isChrome || isSafari;
      }

      // Phát hiện hệ điều hành
      function detectOS() {
        const ua = navigator.userAgent.toLowerCase();
        return {
          isIOS: /iphone|ipad|ipod/.test(ua),
          isAndroid: ua.includes('android'),
          isMobile: /mobile|android|iphone|ipad|ipod/.test(ua)
        };
      }

      // Redirect đến trình duyệt phù hợp
      function redirectToSupportedBrowser() {
        const currentUrl = window.location.href;
        const os = detectOS();
        if (os.isIOS) {
          // iOS - thử mở Safari trước
          try {
            window.location.href = "x-safari-" + currentUrl;
          } catch(e) {
            // Fallback - thử Safari scheme khác
            setTimeout(function() {
              try {
                window.location.href = "x-web-search://search?query=" + encodeURIComponent(currentUrl);
              } catch(e) {
                // Cuối cùng thử Chrome
                window.location.href = "googlechrome://navigate?url=" + encodeURIComponent(currentUrl);
              }
            }, 500);
          }
        } else if (os.isAndroid) {
          // Android - mở Chrome thông qua Android Intent (tự chuyển qua Play Store nếu chưa cài)
          const cleanUrl = currentUrl.replace(/^https?:\/\//, '');
          window.location.href = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end";
        } else {
          // Desktop - hiện thông báo
          if (confirm("Trang web này hoạt động tốt nhất trên Chrome hoặc Safari.\n\nBấm OK để tải Chrome, hoặc Cancel để tiếp tục.")) {
            window.open("https://www.google.com/chrome/", "_blank");
          }
        }
      }

      // Kiểm tra và thực hiện action
      function checkAndRedirect() {
        if (!isSupportedBrowser()) {
          redirectToSupportedBrowser();
        }
      }

      // Chạy kiểm tra khi DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', checkAndRedirect);
      } else {
        checkAndRedirect();
      }
    })();
  </script>
